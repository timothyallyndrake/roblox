name: Project Automation

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  issues:
    types: [opened, closed, labeled]

permissions:
  issues: write
  pull-requests: read

jobs:
  sync-playtest-ready:
    name: Label PRs for playtest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Add playtest-ready label on gameplay PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const touchesGame = files.some((f) =>
              f.filename.startsWith("games/") &&
              (f.filename.includes("/src/") || f.filename.endsWith(".rbxlx"))
            );
            if (touchesGame && pr.base.ref === "dev") {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ["type:playtest-ready"],
              });
              core.notice("Added type:playtest-ready label");
            }
